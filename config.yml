baseURL: "https://tomhilder.github.io/"
title: Tom Hilder
theme: PaperMod
ignoreFiles: ["README\\.md$", "README_TEMPLATE\\.md$"]

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

menu:
    main:
        - name: Blog
          url: blog/
          weight: 1
        - name: Research
          url: research/
          weight: 2
        - name: Software
          url: software/
          weight: 3
        - name: Talks
          url: talks/
          weight: 4
        - name: About
          url: about/
          weight: 5

params:
    description: "Personal website of Tom Hilder, PhD Candidate at Monash University researching the ionised interstellar medium using computational statistics and scalable Gaussian Process methods."
    author: Tom Hilder
    # googleAnalyticsID: "G-XXXXX"
    DateFormat: "January 2006"
    # Colour scheme (see assets/css/extended/01-palettes.css):
    #   observatory | ember | nebula | basalt | meridian
    #   rosewood | ultramarine | ink | void | dusk
    palette: nebula
    # The portrait arrives as IFU spaxels and resolves into the photograph
    # (assets/js/spaxels.js). Set false to serve the plain photo instead.
    portraitReveal: true
    defaultTheme: dark
    hideFooter: true
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["research","software","talks","blog"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Tom Hilder
          subtitle: "PhD Candidate at the School of Physics & Astronomy, Monash University. I study the ionised interstellar medium using computational statistics, particularly cutting-edge scalable Gaussian Process methods."
          imageUrl: "img/headshot.jpeg"
          imageTitle: "Tom Hilder"
          imageWidth: 228
          imageHeight: 228
          buttons:
            - name: Blog
              url: blog/
            - name: Research
              url: research/
            - name: Software
              url: software/
            - name: Talks
              url: talks/
            - name: About
              url: about/

    socialIcons:
        - name: Email
          url: mailto:thomas.hilder@monash.edu
        - name: GitHub
          url: https://github.com/tomhilder
        - name: Google Scholar
          url: https://scholar.google.com/citations?user=q0Ol5jsAAAAJ&hl=en
        - name: ORCID
          url: https://orcid.org/0000-0001-7641-5235
        - name: LinkedIn
          url: https://www.linkedin.com/in/thomas-hilder-10623425a
        - name: Bluesky
          url: https://bsky.app/profile/tom-hilder.bsky.social
        - name: YouTube
          url: https://youtube.com/@tomhilder-astro

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Tom Hilder"

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2